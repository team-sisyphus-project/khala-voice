<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Material Symbols Rounded — the same set as LiveView (root.html.heex) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <!-- iOS ignores the manifest's display. This meta is what makes it open fullscreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KHALA VOICE" />
    <title>KHALA VOICE</title>

    <script>
      // Apply the theme before first paint.
      //
      // On the LiveView side the server stamps html[data-theme], but this is a
      // static index.html so it can't. Paint from the localStorage cache first,
      // then correct with the /api/me value once the app is up.
      //
        // The devkanban tokens and the first-visit default are both light.
      (() => {
        const root = document.documentElement;

        for (const key of ["reduce-motion", "reduce-blur"]) {
          if (localStorage.getItem("vr:" + key) === "true") {
            root.setAttribute("data-" + key, "true");
          }
        }

        // All themes are inside the bundle (`packages/ui-styles`). Nothing fetched separately.
        root.setAttribute("data-theme", localStorage.getItem("vr:theme") || "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
