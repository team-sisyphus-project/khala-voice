<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Voice Recording">
  <!--
    Maskable icon. Android crops it into circles, squircles, and so on.

    The safe zone is the central 80% (40% radius). The microphone stays inside it
    and the background runs to the edges, so no white border appears no matter
    what shape it is cropped to.
  -->
  <rect width="512" height="512" fill="#E5484D"/>
  <g fill="#fff" transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <rect x="216" y="112" width="80" height="176" rx="40"/>
    <path d="M168 240a12 12 0 0 1 24 0 64 64 0 0 0 128 0 12 12 0 0 1 24 0 88 88 0 0 1-76 87.2V368h40a12 12 0 0 1 0 24H204a12 12 0 0 1 0-24h40v-40.8A88 88 0 0 1 168 240z"/>
  </g>
</svg>
