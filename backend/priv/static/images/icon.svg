<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Voice Recording">
  <!--
    앱 아이콘. 마이크 하나.

    Phoenix 기본 로고(logo.svg)를 그대로 쓰지 않는다 — 이 앱의 것이 아니다.
    색은 라이트 테마의 키 색상(빨강)을 따른다. sisyphus 와 같은 계열이다.
