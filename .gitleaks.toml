# gitleaks configuration — this repo is published as open source.
# pre-commit:  gitleaks protect --staged --config .gitleaks.toml
# CI:          gitleaks detect --config .gitleaks.toml --redact

[extend]
useDefault = true

# Workflow exports and config JSON are the most common leak paths.
# (Precedent: in sisyphus, an AWS key was committed in plaintext inside an n8n export JSON)
[[rules]]
id = "aws-access-key-anywhere"
description = "AWS Access Key ID (any file type)"
regex = '''(A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}'''

[[rules]]
id = "gcp-service-account-json"
description = "GCP service account private key"
regex = '''"type"\s*:\s*"service_account"'''

# Credentials issued by this app. Share tokens **work immediately without any
# further authentication** — committing one by accident opens up the whole meeting.
[[rules]]
id = "vr-share-token"
description = "Meeting share link token (slt_)"
regex = '''\bslt_[A-Za-z0-9_\-]{40,}'''

[[rules]]
id = "vr-guest-token"
description = "Guest session token (gst_)"
regex = '''\bgst_[A-Za-z0-9_\-]{40,}'''

[[rules]]
id = "generic-api-key-assignment"
description = "Hardcoded key assignment in code"
regex = '''(?i)(api[_-]?key|secret[_-]?key|access[_-]?key|client[_-]?secret|password|token)\s*[:=]\s*["'][A-Za-z0-9_\-/+]{16,}["']'''

[[allowlists]]
description = "Examples, docs, test fixtures"
# ⚠ targetRules is mandatory here. Without it, **every rule is disabled** on
#    these paths — a real AWS key pasted into a doc would not be caught.
targetRules = ["generic-api-key", "generic-api-key-assignment"]
paths = [
  '''\.env\.example$''',
  '''^docs/''',
  '''\.gitleaks\.toml$''',
]
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',      # example value from the official AWS docs
  '''(?i)your[_-]?(api[_-])?key''',
  '''(?i)(xxx+|<[a-z_]+>|\.\.\.)''',
]

# Paths that are never commit targets. Scanning third-party sources and build
# output piles up false positives that bury real leaks.
[[allowlists]]
description = "Build output, third-party code, dev certificates"
paths = [
  '''^backend/deps/''',
  '''^backend/_build/''',
  '''node_modules/''',
  '''^backend/priv/cert/''',
  '''^backend/priv/static/''',
]

# Phoenix-generated dev/test secret_key_base, CI-only dummy keys, test passwords.
# None are production values, and they live only in these files.
# The AWS/GCP key rules still apply here — a real key gets caught wherever it is.
[[allowlists]]
description = "Dev/test-only constants"
targetRules = ["generic-api-key", "generic-api-key-assignment"]
paths = [
  '''^backend/config/(dev|test)\.exs$''',
  '''^backend/test/''',
  '''^\.github/workflows/''',
]
