name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the full history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      MIX_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vr_test
      # Test-only key. Unrelated to any real deployment.
      CLOAK_KEY: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nISEhIQ==
      SECRET_KEY_BASE: ${{ secrets.CI_SECRET_KEY_BASE || 'ZmFrZS1jaS1zZWNyZXQta2V5LWJhc2UtZm9yLXRlc3RzLW9ubHktbm90LXVzZWQtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - name: Format check
        run: mix format --check-formatted
      - name: Compile (warnings are failures)
        run: mix compile --warnings-as-errors
      - name: Test
        run: mix test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install core
        working-directory: packages/core
        run: npm ci || npm install
      - name: Typecheck core
        working-directory: packages/core
        run: npm run typecheck
      - name: Test core
        working-directory: packages/core
        run: npm test
      - name: Install web
        working-directory: apps/web
        run: npm ci || npm install
      - name: Build web (includes typecheck)
        working-directory: apps/web
        run: npm run build
